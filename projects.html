
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>HOWLADER X — Project Studio</title>

<style>
:root {
    --bg:#080808;
    --panel:#111111;
    --panel2:#191919;
    --gold:#D4AF37;
    --gold2:#F5D778;
    --text:#F5F5F5;
    --muted:#999999;
    --border:rgba(212,175,55,.22);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding-bottom:85px;
}

header {
    height:60px;
    padding:0 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0c0c0c;
    border-bottom:1px solid var(--border);
}

.logo {
    color:var(--gold);
    font-size:19px;
    font-weight:800;
    letter-spacing:1px;
}

button {
    cursor:pointer;
    font-family:inherit;
}

.header-btn {
    background:transparent;
    color:var(--gold2);
    border:1px solid var(--border);
    padding:8px 13px;
    border-radius:8px;
}

.container {
    width:92%;
    max-width:850px;
    margin:20px auto;
}

.welcome {
    padding:20px;
    border:1px solid var(--border);
    border-radius:14px;
    background:linear-gradient(120deg,#1c180b,#111);
    animation:slideReveal .5s ease;
}

.welcome h2 {
    color:var(--gold2);
    font-size:21px;
    margin-bottom:7px;
}

.welcome p {
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:15px 0;
}

.stat-card {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 7px;
    text-align:center;
}

.stat-card strong {
    display:block;
    color:var(--gold);
    font-size:19px;
}

.stat-card span {
    color:var(--muted);
    font-size:11px;
}

.section-title {
    color:var(--gold2);
    font-size:16px;
    margin:22px 0 12px;
}

.add-project-btn {
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:linear-gradient(120deg,var(--gold),var(--gold2));
    color:#111;
    font-weight:bold;
    margin-bottom:14px;
}

@keyframes slideReveal {
    from {
        opacity:0;
        transform:translateY(12px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes goldPulse {
    0%,100% {
        box-shadow:0 0 0 transparent;
    }
    50% {
        box-shadow:0 0 18px rgba(212,175,55,.17);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">HOWLADER X</div>
    <button class="header-btn" onclick="goHome()">⌂ Home</button>
</header>

<main class="container">

<section class="welcome">
    <h2>Project Studio</h2>
    <p>Create, customize and manage your digital projects.</p>
</section>

<section class="stats">
    <div class="stat-card">
        <strong id="projectCount">0</strong>
        <span>Projects</span>
    </div>
    <div class="stat-card">
        <strong id="activeCount">0</strong>
        <span>Active</span>
    </div>
    <div class="stat-card">
        <strong id="completedCount">0</strong>
        <span>Completed</span>
    </div>
</section>

<h3 class="section-title">Project Management</h3>

<button class="add-project-btn" onclick="openCreateModal()">
    + Create New Project
</button>

<h3 class="section-title">My Projects</h3>

<input id="searchInput" type="search"
placeholder="Search your projects...">

<div class="filter-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Active">Active</button>
    <button class="filter-btn" data-filter="Completed">Completed</button>
</div>

<div id="customProjects" class="project-grid"></div>

<h3 class="section-title">Project Files</h3>

<div class="file-filters">
    <button class="file-filter active" data-type="all">All</button>
    <button class="file-filter" data-type="html">HTML</button>
    <button class="file-filter" data-type="css">CSS</button>
    <button class="file-filter" data-type="js">JavaScript</button>
</div>

<div id="projectGrid" class="project-grid"></div>
<div id="emptyState" hidden>No files found.</div>

<h3 class="section-title">Recent Files</h3>
<div id="recentList"></div>

</main>

<!-- CREATE / EDIT MODAL -->
<div class="project-modal" id="editModal">
    <div class="modal-content">

        <h2 id="modalHeading">Create Project</h2>

        <label for="modalName">Project Name</label>
        <input id="modalName" maxlength="50"
        placeholder="Enter project name">

        <label for="modalDescription">Description</label>
        <textarea id="modalDescription" maxlength="300"
        placeholder="Describe your project"></textarea>

        <label for="modalCategory">Category</label>
        <select id="modalCategory">
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>Other</option>
        </select>

        <label for="modalColor">Project Color</label>
        <input id="modalColor" type="color" value="#D4AF37">

        <label for="modalImage">Cover Image URL (Optional)</label>
        <input id="modalImage" type="url"
        placeholder="https://example.com/image.jpg">

        <label for="modalStatus">Project Status</label>
        <select id="modalStatus">
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
        </select>

        <label for="modalProgress">Project Progress</label>
        <input id="modalProgress" type="range"
        min="0" max="100" value="0"
        oninput="updateProgressLabel()">

        <p id="progressLabel">Progress: 0%</p>

        <div class="modal-buttons">
            <button onclick="saveProject()">Save Project</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>

        <p id="modalMessage"></p>

    </div>
</div>

<!-- DETAILS MODAL -->
<div class="project-modal" id="detailsModal">
    <div class="modal-content">
        <h2 id="detailsName">Project Details</h2>
        <div id="detailsImage"></div>
        <p id="detailsDescription"></p>
        <p id="detailsCategory"></p>
        <p id="detailsStatus"></p>
        <p id="detailsDate"></p>

        <div class="modal-buttons">
            <button class="close-btn"
            onclick="closeDetails()">Close</button>
        </div>
    </div>
</div>

<style>
.project-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:13px;
}

.project-card {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    min-width:0;
    animation:slideReveal .4s ease;
    transition:transform .25s,border-color .25s;
}

.project-card:hover {
    transform:translateY(-4px);
    border-color:var(--gold);
}

.project-cover {
    width:100%;
    height:115px;
    object-fit:cover;
    display:block;
    background:#191919;
}

.project-card-content {
    padding:12px;
}

.project-card h3 {
    color:var(--gold2);
    font-size:14px;
    overflow-wrap:anywhere;
    margin-bottom:8px;
}

.project-card p {
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    margin:8px 0;
    overflow-wrap:anywhere;
}

.project-category {
    display:inline-block;
    padding:4px 8px;
    border-radius:5px;
    font-size:10px;
    background:rgba(212,175,55,.1);
    color:var(--gold2);
}

.status-label {
    display:inline-block;
    font-size:10px;
    padding:4px 8px;
    border-radius:5px;
    margin:7px 0;
}

.status-active {
    background:rgba(212,175,55,.12);

}

.status-completed {
    background:rgba(60,180,110,.13);
    color:#7ee0a4;
}

.progress-info {
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:10px;
    margin:10px 0 5px;
}

.progress-track {
    height:6px;
    width:100%;
    background:#292929;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill {
    height:100%;
    border-radius:10px;
    transition:width .4s ease;
}

.project-actions {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:12px;
}

.project-actions button {
    flex:1;
    min-width:50px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--gold2);
    padding:7px 5px;
    border-radius:6px;
    font-size:10px;
}

.project-actions .delete-btn {
    color:#ff7777;
    border-color:rgba(255,100,100,.3);

.project-modal {
    position:fixed;
    inset:0;

    display:none;

.modal-content {

.modal-content h2 {

.modal-content input,

.modal-content input[type="color"] {

<nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="chat.html">AI Assistant</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

<script>
"use strict";

const STORAGE_KEY = "howladerCustomProjectsV1";
let editingProjectId = null;
let activeProjectFilter = "all";
let activeFileFilter = "all";

const $ = id => document.getElementById(id);

function getProjects() {
    try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(data)) return [];

        return data.filter(p =>
            p &&
            p.id !== undefined &&
            typeof p.name === "string" &&
            typeof p.description === "string" &&
            typeof p.category === "string"
        ).map(p => ({
            ...p,
            color: /^#[0-9a-fA-F]{6}$/.test(p.color || "")
                ? p.color : "#D4AF37",
            image: typeof p.image === "string" ? p.image : "",
            status: p.status === "Completed" ? "Completed" : "Active",
            progress: Math.max(0, Math.min(100, parseInt(p.progress, 10) || 0))
        }));
    } catch (error) {
        console.error("Project data could not be read:", error);
        return [];
    }
}

function saveProjects(projects) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        return true;
    } catch (error) {
        alert("Unable to save projects. Check your browser storage.");
        return false;
    }
}

function goHome() {
    location.href = "index.html";
}

function openCreateModal() {
    editingProjectId = null;
    $("modalHeading").textContent = "Create Project";
    $("modalName").value = "";
    $("modalDescription").value = "";
    $("modalCategory").value = "HTML";
    $("modalColor").value = "#D4AF37";
    $("modalImage").value = "";
    $("modalStatus").value = "Active";
    $("modalProgress").value = 0;
    $("modalMessage").textContent = "";
    updateProgressLabel();
    $("editModal").classList.add("show");
}

function openEditModal(id) {
    const project = getProjects().find(p => String(p.id) === String(id));
    if (!project) return;

    editingProjectId = project.id;
    $("modalHeading").textContent = "Edit Project";
    $("modalName").value = project.name;
    $("modalDescription").value = project.description;
    $("modalCategory").value = project.category;
    $("modalColor").value = project.color;
    $("modalImage").value = project.image;
    $("modalStatus").value = project.status;
    $("modalProgress").value = project.progress;
    $("modalMessage").textContent = "";
    updateProgressLabel();
    $("editModal").classList.add("show");
}

function closeModal() {
    $("editModal").classList.remove("show");
}

function updateProgressLabel() {
    $("progressLabel").textContent =
        "Progress: " + $("modalProgress").value + "%";
}

function validImageURL(value) {
    if (!value.trim()) return true;

    try {
        const url = new URL(value.trim());
        return url.protocol === "https:" || url.protocol === "http:";
    } catch {
        return false;
    }
}

function saveProject() {
    const name = $("modalName").value.trim();
    const description = $("modalDescription").value.trim();
    const category = $("modalCategory").value;
    const color = $("modalColor").value;
    const image = $("modalImage").value.trim();
    const status = $("modalStatus").value;
    const progress = Math.max(
        0,
        Math.min(100, parseInt($("modalProgress").value, 10) || 0)
    );

    if (!name) {
        $("modalMessage").textContent = "Please enter a project name.";
        return;
    }

    if (!/^#[0-9a-fA-F]{6}$/.test(color)) {
        $("modalMessage").textContent = "Please select a valid project color.";
        return;
    }

    if (!validImageURL(image)) {
        $("modalMessage").textContent = "Use a valid HTTP or HTTPS image URL.";
        return;
    }

    if (!["Active", "Completed"].includes(status)) {
        $("modalMessage").textContent = "Please select a valid status.";
        return;
    }

    const projects = getProjects();

    if (editingProjectId !== null) {
        const index = projects.findIndex(
            p => String(p.id) === String(editingProjectId)
        );

        if (index === -1) return;

        projects[index] = {
            ...projects[index],
            name,
            description,
            category,
            color,
            image,
            status,
            progress
        };
    } else {
        projects.unshift({
            id: Date.now().toString(),
            name,
            description,
            category,
            color,
            image,
            status,
            progress,
            createdAt: new Date().toISOString()
        });
    }

    if (!saveProjects(projects)) return;

    closeModal();
    renderCustomProjects();
}

function openDetails(id) {
    const project = getProjects().find(p => String(p.id) === String(id));
    if (!project) return;

    $("detailsName").textContent = project.name;
    $("detailsDescription").textContent =
        "Description: " + (project.description || "No description");
    $("detailsCategory").textContent =
        "Category: " + project.category;
    $("detailsStatus").textContent =
        "Status: " + project.status + " | Progress: " + project.progress + "%";

    const date = project.createdAt
        ? new Date(project.createdAt).toLocaleDateString()
        : "Previously created";

    $("detailsDate").textContent = "Created: " + date;

    const imageBox = $("detailsImage");
    imageBox.replaceChildren();

    if (validImageURL(project.image) && project.image) {
        const img = document.createElement("img");
        img.src = project.image;
        img.alt = "Project cover";
        img.onerror = () => img.remove();
        imageBox.appendChild(img);
    }

    $("detailsModal").classList.add("show");
}

function closeDetails() {
    $("detailsModal").classList.remove("show");
}

function deleteProject(id) {
    if (!confirm("Delete this project?")) return;

    const projects = getProjects().filter(
        p => String(p.id) !== String(id)
    );

    if (saveProjects(projects)) {
        renderCustomProjects();
    }
}

function renderCustomProjects() {
    const container = $("customProjects");
    const projects = getProjects();

    const search = $("searchInput").value.trim().toLowerCase();

    const filtered = projects.filter(project => {
        const matchesSearch =
            project.name.toLowerCase().includes(search) ||
            project.description.toLowerCase().includes(search) ||
            project.category.toLowerCase().includes(search);

        const matchesStatus =
            activeProjectFilter === "all" ||
            project.status === activeProjectFilter;

        return matchesSearch && matchesStatus;
    });

    container.replaceChildren();

    projects.forEach(() => {});

    $("projectCount").textContent = projects.length;
    $("activeCount").textContent =
        projects.filter(p => p.status === "Active").length;
    $("completedCount").textContent =
        projects.filter(p => p.status === "Completed").length;

    if (!filtered.length) {
        const empty = document.createElement("p");
        empty.textContent = "No matching projects found.";
        empty.style.cssText = "color:#999;padding:20px;text-align:center;";
        container.appendChild(empty);
        return;
    }

    filtered.forEach(project => {
        const card = document.createElement("article");
        card.className = "project-card";
        card.style.setProperty("--project-color", project.color);
        card.style.borderColor = project.color + "66";

        if (project.image && validImageURL(project.image)) {
            const img = document.createElement("img");
            img.className = "project-cover";
            img.src = project.image;
            img.alt = project.name + " cover";
            img.onerror = () => img.remove();
            card.appendChild(img);
        }

        const content = document.createElement("div");
        content.className = "project-card-content";

        const heading = document.createElement("h3");
        heading.textContent = project.name;
        heading.style.color = project.color;

        const category = document.createElement("span");
        category.className = "project-category";
        category.textContent = project.category;

        const status = document.createElement("span");
        status.className = "status-label " +
            (project.status === "Completed"
                ? "status-completed" : "status-active");
        status.textContent = project.status;

        const description = document.createElement("p");
        description.textContent =
            project.description || "No description provided.";

        const progressInfo = document.createElement("div");
        progressInfo.className = "progress-info";

        const progressText = document.createElement("span");
        progressText.textContent = "Progress";

        const progressNumber = document.createElement("span");
        progressNumber.textContent = project.progress + "%";

        progressInfo.append(progressText, progressNumber);

        const track = document.createElement("div");
        track.className = "progress-track";

        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = project.progress + "%";
        fill.style.background = project.color;

        track.appendChild(fill);

        const actions = document.createElement("div");
        actions.className = "project-actions";

        function makeButton(label, callback, extraClass = "") {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            if (extraClass) button.className = extraClass;
            button.addEventListener("click", callback);
            return button;
        }

        actions.append(
            makeButton("Details", () => openDetails(project.id)),
            makeButton("Edit", () => openEditModal(project.id)),
            makeButton("Delete", () => deleteProject(project.id), "delete-btn")
        );

        content.append(
            heading,
            category,
            status,
            description,
            progressInfo,
            track,
            actions
        );

        card.appendChild(content);
        container.appendChild(card);
    });
}

const projectFiles = [
    {name:"index.html",type:"html"},
    {name:"projects.html",type:"html"},
    {name:"dashboard.html",type:"html"},
    {name:"admin.html",type:"html"},
    {name:"login.html",type:"html"},
    {name:"signup.html",type:"html"},
    {name:"notes.html",type:"html"},
    {name:"calendar.html",type:"html"},
    {name:"todo.html",type:"html"},
    {name:"calculator.html",type:"html"},
    {name:"stopwatch.html",type:"html"},
    {name:"music.html",type:"html"},
    {name:"chat.html",type:"html"},
    {name:"style.css",type:"css"},
    {name:"script.js",type:"js"}
];

function renderFiles() {
    const grid = $("projectGrid");
    const empty = $("emptyState");
    grid.replaceChildren();

    const files = projectFiles.filter(file =>
        activeFileFilter === "all" ||
        file.type === activeFileFilter
    );

    files.forEach(file => {
        const card = document.createElement("article");
        card.className = "project-card";
        const content = document.createElement("div");
        content.className = "project-card-content";

        const title = document.createElement("h3");
        title.textContent = file.name;

        const type = document.createElement("p");
        type.textContent = file.type.toUpperCase() + " FILE";

        const open = document.createElement("button");
        open.className = "header-btn";
        open.textContent = "Open File";
        open.addEventListener("click", () => {
            location.href = file.name;
        });

        content.append(title, type, open);
        card.appendChild(content);
        grid.appendChild(card);
    });

    empty.hidden = files.length !== 0;
}

function renderRecent() {
    const recent = $("recentList");
    recent.replaceChildren();

    const names = [
        "index.html",
        "projects.html",
        "style.css",
        "script.js"
    ];

    names.forEach(name => {
        const item = document.createElement("div");
        item.className = "recent-item";
        item.textContent = name;
        recent.appendChild(item);
    });
}

document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", () => {
        activeProjectFilter = button.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach(btn =>
            btn.classList.toggle("active", btn === button)
        );
        renderCustomProjects();
    });
});

document.querySelectorAll(".file-filter").forEach(button => {
    button.addEventListener("click", () => {
        activeFileFilter = button.dataset.type;
        document.querySelectorAll(".file-filter").forEach(btn =>
            btn.classList.toggle("active", btn === button)
        );
        renderFiles();
    });
});

$("searchInput").addEventListener("input", renderCustomProjects);
$("modalProgress").addEventListener("input", updateProgressLabel);

$("editModal").addEventListener("click", event => {
    if (event.target === $("editModal")) closeModal();
});

$("detailsModal").addEventListener("click", event => {
    if (event.target === $("detailsModal")) closeDetails();
});

renderCustomProjects();
renderFiles();
renderRecent();
updateProgressLabel();
</script>
</body>
</html>
