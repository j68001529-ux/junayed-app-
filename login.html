<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HOWLADER X</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 390px;
            padding: 32px 25px;
            background: #151515;
            border: 1px solid #66521c;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 17px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #f5d778, #a77b16);
            color: #111;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            color: #f5d778;
            margin-bottom: 9px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 26px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 11px;
            background: #222;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #f5d778, #c49a25);
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot {
            margin-top: 18px;
        }

        .forgot a,
        .signup a {
            color: #e7c65c;
            text-decoration: none;
        }

        .signup {
            margin-top: 22px;
            color: #bbb;
            font-size: 14px;
        }

        #message {
            margin-top: 17px;
            color: #f5d778;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">H</div>

        <h1>HOWLADER X</h1>
        <p class="subtitle">Welcome Back! Please Login</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <p class="forgot">
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </p>

        <p class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p id="message" aria-live="polite"></p>

    </div>

    <script type="module">

        import { auth } from "./firebase.js";

        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");

        // Firebase Login
        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            message.textContent = "লগইন হচ্ছে...";
            loginButton.disabled = true;

            try {

                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = userCredential.user;

                localStorage.setItem(
                    "howladerUserEmail",
                    user.email || ""
                );

                localStorage.setItem(
                    "howladerUserName",
                    user.displayName || (user.email ? user.email.split("@")[0] : "User")
                );

                message.textContent = "লগইন সফল! Dashboard-এ নেওয়া হচ্ছে...";

                window.location.href = "dashboard.html";

            } catch (error) {

                message.textContent =
                    "লগইন হয়নি। ইমেইল ও পাসওয়ার্ড পরীক্ষা করো।";

                loginButton.disabled = false;

            }

        });

        // Forgot Password
        document.getElementById("forgotPassword")
            .addEventListener("click", async function(event) {

                event.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    message.textContent = "আগে Email লিখুন।";
                    emailInput.focus();
                    return;
                }

                message.textContent = "রিসেট লিংক পাঠানো হচ্ছে...";

                try {

                    await sendPasswordResetEmail(auth, email);

                    message.textContent =
                        "পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে।";

                } catch (error) {

                    message.textContent =
                        "লিংক পাঠানো যায়নি। ইমেইল পরীক্ষা করুন।";

                }

            });

    </script>

</body>
</html>
