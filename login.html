<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JUNAYED APP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 30px 24px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 18px;
            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #7c3aed;
            font-size: 35px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #252525;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup {
            margin-top: 20px;
            color: #bbb;
            font-size: 14px;
        }

        .signup a {
            color: #a78bfa;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            color: #fca5a5;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo">J</div>

        <h1>JUNAYED APP</h1>
        <p class="subtitle">Welcome Back! Please Login</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p id="message"></p>
    </div>
<script type="module">
import { auth } from "./firebase.js";
import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "লগইন হচ্ছে...";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        message.textContent = "লগইন সফল হয়েছে!";
        window.location.href = "index.html";
    } catch (error) {
        message.textContent = "লগইন হয়নি। ইমেইল ও পাসওয়ার্ড পরীক্ষা করো।";
    }
});
</script>
</body>
</html>
