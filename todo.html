<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>HOWLADER X — Task Manager</title>

<style>
:root{
  --bg:#090909;
  --panel:#151515;
  --gold:#d4af37;
  --gold2:#f5d778;
  --text:#f5f5f5;
  --muted:#999;
  --border:rgba(212,175,55,.22);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#211b0d,transparent 45%),var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  padding:17px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.brand{font-size:21px;font-weight:bold;color:var(--gold2)}
.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
a{color:var(--gold2);text-decoration:none}
button{
  padding:11px 14px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#222;
  color:var(--gold2);
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#302a17}
button:disabled{opacity:.6;cursor:not-allowed}
main{max-width:850px;margin:auto;padding:25px 18px}
h1{color:var(--gold2);font-size:28px;margin-bottom:8px}
h3{color:var(--gold2);margin-top:0}
.subtitle{color:var(--muted);font-size:13px;line-height:1.7}
.user-info{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.panel{
  background:rgba(21,21,21,.96);
  border:1px solid var(--border);
  border-radius:16px;
  padding:19px;
  margin-top:20px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.stat{background:#202020;padding:15px;border-radius:11px}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat strong{display:block;color:var(--gold2);font-size:26px;margin-top:8px}
input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  background:#090909;
  color:white;
  border:1px solid #393939;
  border-radius:9px;
  outline:none;
}
input:focus{border-color:var(--gold)}
label{font-size:13px;color:#ccc}
.primary{
  background:linear-gradient(135deg,#f5d778,#b38a25);
  color:#111;
  border:0;
}
.primary:hover{background:var(--gold2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters button.active{background:var(--gold);color:#111}
.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 9px;
  border-bottom:1px solid #292929;
}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{
  width:19px;height:19px;
  accent-color:var(--gold);
  margin:0;
  flex-shrink:0;
}
.task-info{flex:1;min-width:0}
.task-name{font-size:14px;overflow-wrap:anywhere}
.task-meta{font-size:11px;color:var(--muted);margin-top:6px}
.task.done .task-name{text-decoration:line-through;color:#777}
.delete{font-size:11px;padding:8px}
.empty{color:var(--muted);font-size:13px;padding:15px 5px}
.footer{text-align:center;color:#666;font-size:11px;padding:25px}
#message{color:var(--gold2);font-size:13px;margin-top:12px}
@media(max-width:550px){
  main{padding:17px 11px}
  .stats{gap:7px}
  .stat{padding:11px}
  .stat span{font-size:10px}
  .stat strong{font-size:21px}
  .task{gap:8px}
  header{padding:15px}
}
</style>
</head>

<body>

<header>
  <div class="brand">HOWLADER X</div>
  <div class="header-actions">
    <a href="dashboard.html">← Dashboard</a>
    <button id="logoutButton" type="button">Logout</button>
  </div>
</header>

<main>
  <h1>Task Manager</h1>
  <p class="subtitle">
    Add your daily tasks, complete them, and track your progress.
  </p>
  <p class="user-info" id="userInfo">Verifying account...</p>

  <section class="panel stats">
    <div class="stat">
      <span>Total Tasks</span>
      <strong id="total">0</strong>
    </div>
    <div class="stat">
      <span>Completed</span>
      <strong id="completed">0</strong>
    </div>
    <div class="stat">
      <span>Remaining</span>
      <strong id="remaining">0</strong>
    </div>
  </section>

  <section class="panel">
    <h3>＋ Add New Task</h3>
    <form id="taskForm">
      <label for="taskInput">Task Name</label>
      <input
        id="taskInput"
        maxlength="150"
        placeholder="e.g. Study, Shopping..."
        required
      >

      <label for="taskDate">Due Date</label>
      <input id="taskDate" type="date">

      <button class="primary" type="submit">＋ Add Task</button>
    </form>
  </section>

  <section class="panel">
    <h3>My Tasks</h3>

    <div class="filters">
      <button class="active" data-filter="all" type="button">All</button>
      <button data-filter="pending" type="button">Pending</button>
      <button data-filter="done" type="button">Completed</button>
    </div>

    <div id="taskList"></div>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>

<footer class="footer">© 2026 HOWLADER X · Task Manager</footer>

<script type="module">
import { auth } from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const KEY = "howladerTasksV1";

const form = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const taskDate = document.getElementById("taskDate");
const taskList = document.getElementById("taskList");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logoutButton");

let tasks = loadTasks();
let filter = "all";
let authenticated = false;

function loadTasks(){
  try{
    const data = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(data) ? data : [];
  }catch{
    return [];
  }
}

function saveTasks(){
  localStorage.setItem(KEY, JSON.stringify(tasks));
}

function updateStats(){
  const done = tasks.filter(task => task.completed).length;

  document.getElementById("total").textContent = tasks.length;
  document.getElementById("completed").textContent = done;
  document.getElementById("remaining").textContent = tasks.length - done;
}

function renderTasks(){
  taskList.replaceChildren();
  updateStats();

  const visible = tasks.filter(task => {
    if(filter === "pending") return !task.completed;
    if(filter === "done") return task.completed;
    return true;
  });

  if(visible.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No tasks here. Add a new task to get started.";
    taskList.appendChild(empty);
    return;
  }

  visible.forEach(task => {
    const row = document.createElement("div");
    row.className = "task" + (task.completed ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = Boolean(task.completed);
    checkbox.setAttribute("aria-label", "Mark task as completed");

    checkbox.addEventListener("change", () => {
      task.completed = checkbox.checked;
      saveTasks();
      renderTasks();
    });

    const info = document.createElement("div");
    info.className = "task-info";

    const name = document.createElement("div");
    name.className = "task-name";
    name.textContent = task.title || "Untitled Task";

    const meta = document.createElement("div");
    meta.className = "task-meta";
    meta.textContent = task.date
      ? "Due date: " + task.date
      : "No due date";

    info.append(name, meta);

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.type = "button";
    remove.textContent = "Delete";

    remove.addEventListener("click", () => {
      if(!confirm("Are you sure you want to delete this task?")) return;

      tasks = tasks.filter(item => item.id !== task.id);
      saveTasks();
      renderTasks();
    });

    row.append(checkbox, info, remove);
    taskList.appendChild(row);
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();

  if(!authenticated){
    message.textContent = "Please wait for account verification.";
    return;
  }

  const title = taskInput.value.trim();
  if(!title) return;

  tasks.unshift({
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString() + Math.random().toString(16).slice(2),
    title,
    date: taskDate.value,
    completed: false
  });

  saveTasks();
  form.reset();
  message.textContent = "Task added successfully.";
  renderTasks();
  taskInput.focus();
});

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderTasks();
  });
});

logoutButton.addEventListener("click", async () => {
  logoutButton.disabled = true;

  try{
    await signOut(auth);
    localStorage.removeItem("howladerUserName");
    localStorage.removeItem("howladerUserEmail");
    window.location.href = "login.html";
  }catch(error){
    message.textContent = "Logout failed. Please try again.";
    logoutButton.disabled = false;
  }
});

onAuthStateChanged(auth, user => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  authenticated = true;

  document.getElementById("userInfo").textContent =
    "Logged in: " + (user.email || "");

  localStorage.setItem(
    "howladerUserName",
    user.displayName || "User"
  );

  localStorage.setItem(
    "howladerUserEmail",
    user.email || ""
  );

  renderTasks();
});

renderTasks();
</script>

</body>
</html>
