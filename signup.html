
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Create Account | HOWLADER X</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at top, #29200b, transparent 45%),
                #090909;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .signup-box {
            width: 100%;
            max-width: 400px;
            padding: 32px 25px;
            background: rgba(24, 24, 24, 0.96);
            border: 1px solid #6e5720;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #d4af37, #8c6a16);
            color: #090909;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            color: #f5d778;
            font-size: 27px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 26px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #454545;
            border-radius: 11px;
            outline: none;
            background: #252525;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #f5d778, #b38a25);
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:not(:disabled):active {
            transform: scale(0.98);
        }

        .login {
            margin-top: 23px;
            color: #aaa;
            font-size: 14px;
        }

        .login a {
            color: #f5d778;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 17px;
            color: #f5d778;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <main class="signup-box">
        <div class="logo">X</div>

        <h1>HOWLADER X</h1>
        <p class="subtitle">Create Your Premium Account</p>

        <form id="signupForm">
            <input
                type="text"
                id="name"
                placeholder="Your Full Name"
                autocomplete="name"
                maxlength="60"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password (at least 6 characters)"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit" id="signupButton">
                Create Account
            </button>
        </form>

        <p class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="footer">POWERED BY HOWLADER X</p>
    </main>

    <script type="module">
        import { auth } from "./firebase.js";

        import {
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const button = document.getElementById("signupButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!name) {
                message.textContent = "তোমার নাম লিখো।";
                return;
            }

            if (password.length < 6) {
                message.textContent =
                    "পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।";
                return;
            }

            button.disabled = true;
            button.textContent = "Creating Account...";
            message.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";

            try {
                const result = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                await updateProfile(result.user, {
                    displayName: name
                });

                localStorage.setItem("howladerUserName", name);
                localStorage.setItem("howladerUserEmail", email);

                message.textContent =
                    "অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!";

                window.location.href = "dashboard.html";

            } catch (error) {
                if (error.code === "auth/email-already-in-use") {
                    message.textContent =
                        "এই ইমেইলে আগে থেকেই অ্যাকাউন্ট আছে।";
                } else if (error.code === "auth/weak-password") {
                    message.textContent =
                        "আরও শক্তিশালী পাসওয়ার্ড ব্যবহার করো।";
                } else if (error.code === "auth/invalid-email") {
                    message.textContent =
                        "সঠিক ইমেইল ঠিকানা লিখো।";
                } else {
                    message.textContent =
                        "অ্যাকাউন্ট তৈরি হয়নি। আবার চেষ্টা করো।";
                }

                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
